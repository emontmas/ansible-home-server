---

- name: Configure jellyfin servers
  hosts: jellyfin_servers
  become: true
  gather_facts: true
  pre_tasks:
    - name: Importing distro specific variables
      tags: always
      ansible.builtin.include_vars: "{{ item }}"
      loop: "{{ [lookup('ansible.builtin.first_found', params) | default(omit, true)] }}"
      vars:
        params:
          files:
            - "{{ ansible_facts['distribution'] | lower | replace(' ', '_') }}-packages.yaml"
            - "{{ ansible_facts['os_family'] | lower | replace(' ', '_') }}-packages.yaml"
          paths:
            - vars
          skip: true

    - name: Install jellyfin dependencies for portable installations
      tags: jellyfin
      when:
        - jellyfin_portable_package | default(false)
        - jellyfin_dependencies_packages is defined
      ansible.builtin.package:
        name: "{{ jellyfin_dependencies_packages }}"
        state: present

  roles:
    - role: jellyfin
      tags: jellyfin
      vars:
        jellyfin_backup_dir: "{{ (backup_dir + '/jellyfin') if backup_dir is defined else '' }}"
    - role: qbittorrent_nox
      tags: qbittorrent

  tasks:
    - name: Add qbt user to jellyfin medias group
      # Can't use tags here, nee both jellyfin and qbittorrent_nox roles to run
      ansible.builtin.user:
        append: true
        name: qbt
        groups: "{{ jellyfin_media_group | default(jellyfin) }}"

# containers:
#   - src: compose file name.
#     user: user owning the containers. Must already exist and have the necessary subuid / subgid configured.
#     config_bind_directories: custom configuration for binded directories.
#     ignore_bind_directories: binded directories to not create.

- name: Configure podman containers
  hosts: servers
  become: true
  tasks:
    - name: Get users informations
      tags: always
      loop:
        - passwd
        - group
      ansible.builtin.getent:
        database: "{{ item }}"

    - name: Run podman_quadlet_compose role
      tags: containers
      loop: "{{ containers }}"
      vars:
        users_facts: "{{ ansible_facts['getent_passwd'] }}"
        groups_facts: "{{ ansible_facts['getent_group'] }}"

        podman_quadlet_compose_src: "{{ item.src }}"
        podman_quadlet_compose_user: "{{ item.user | default(omit) }}"
        podman_quadlet_compose_config_bind_directories: "{{ item.config_bind_directories | default(omit) }}"
        podman_quadlet_compose_ignore_bind_directories: "{{ item.ignore_bind_directories | default([]) }}"

        podman_quadlet_compose_backup_dir: "{{ (backup_dir + '/containers/' + item.src) if backup_dir is defined else '' }}"
      ansible.builtin.include_role:
        name: podman_quadlet_compose
        apply:
          tags: containers

...
