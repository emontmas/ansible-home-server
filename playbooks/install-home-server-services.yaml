---

- name: Configure jellyfin servers
  hosts: jellyfin_servers
  become: true
  gather_facts: true
  pre_tasks:
    - name: Importing distro specific variables
      tags: always
      ansible.builtin.include_vars: "{{ item }}"
      loop: "{{ [lookup('ansible.builtin.first_found', params) | default(omit, true)] }}"
      vars:
        params:
          files:
            - "{{ ansible_facts['distribution'] | lower | replace(' ', '_') }}-packages.yaml"
            - "{{ ansible_facts['os_family'] | lower | replace(' ', '_') }}-packages.yaml"
          paths:
            - vars
          skip: true

    - name: Install jellyfin dependencies for portable installations
      tags: jellyfin
      when:
        - jellyfin_portable_package | default(false)
        - jellyfin_dependencies_packages is defined
      ansible.builtin.package:
        name: "{{ jellyfin_dependencies_packages }}"
        state: present

  roles:
    - role: jellyfin
      tags: jellyfin
    - role: qbittorrent_nox
      tags: qbittorrent

  tasks:
    - name: Add qbt user to jellyfin medias group
      # Can't use tags here, nee both jellyfin and qbittorrent_nox roles to run
      ansible.builtin.user:
        append: true
        name: qbt
        groups: "{{ jellyfin_media_group | default(jellyfin) }}"

    - name: Create firwalld services
      tags: firewall
      when: firewalld_enabled | default(false)
      ansible.builtin.template:
        src: firewalld-service.xml.j2
        dest: /etc/firewalld/services/{{ item.service }}.xml
        owner: root
        group: root
        mode: "0644"
      vars:
        service_description: "{{ item.service_description }}"
        service_port: "{{ item.service_port }}"
        service_protocol: "{{ item.service_protocol }}"
      loop:
        - service: jellyfin
          service_description: Jellyfin server
          service_port: 8096
          service_protocol: tcp
        - service: qbittorrent-nox
          service_description: QBittorent WebUI
          service_port: 8080
          service_protocol: tcp
      notify: Reload firewalld

  post_tasks:
    - name: Enable firewalld services on home network
      tags: firewall
      when: firewalld_enabled | default(false)
      ansible.posix.firewalld:
        service: "{{ item }}"
        state: enabled
        permanent: true
        immediate: true
        zone: home
      loop:
        - jellyfin
        - qbittorrent-nox

  handlers:
    - name: Reload firewalld
      ansible.builtin.command: firewall-cmd --reload

...
