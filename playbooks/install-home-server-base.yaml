---

- name: Load distro specific variables
  hosts: servers
  gather_facts: true
  tags: always
  vars_files:
    - distro.yaml
  tasks:
    - name: Importing distro specific variables
      ansible.builtin.include_vars: "{{ item }}"
      loop: "{{ distro_vars_files }}"


- name: Configure server distribution
  hosts: servers
  become: true
  gather_facts: true
  vars_files:
    - packages.yaml
  tasks:
    - name: Install base packages
      tags: base_packages
      ansible.builtin.package:
        name: "{{ base_packages }}"
        state: present

    - name: Enable and start base packages services
      tags: base_packages
      loop: "{{ post_install_start_services | default([]) }}"
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started


    - name: Configure users
      tags: users
      block:
        - name: Create users
          loop: "{{ users | dict2items }}"
          vars:
            # These are used for other tasks of this playbook
            filter_out_keys:
              - administrator
              - authorized_key

            params: "{{ item.value | dict2items | rejectattr('key', 'in', filter_out_keys) | items2dict }}"
          ansible.builtin.user: "{{ {'name': item.key} | combine(params) }}"

        - name: Add admin authorized SSH keys
          loop: "{{ users | dict2items
                    | selectattr('value.authorized_key', 'defined') }}"
          ansible.posix.authorized_key:
            user: "{{ item.key }}"
            key: "{{ item.value.authorized_key }}"

        # As of Ansible 13, the module community.general.sudoers doesn't support setting
        # 'Defaults' directives. As it is desiered to allow admin user to use its own password,
        # a template file is used instead for now.
        - name: Configure sudo for administrators
          loop: "{{ users | dict2items
                    | selectattr('value.administrator', 'defined')
                    | selectattr('value.administrator')
                    | map(attribute='key') }}"
          loop_control:
            loop_var: user
          ansible.builtin.template:
            src: admin.sudoers.j2
            dest: /etc/sudoers.d/{{ user }}
            owner: root
            group: root
            mode: "0644"

        - name: Force user home directories ownership
          loop: "{{ users | dict2items }}"
          when:
            - users_force_home_ownership | default(false)
            - item.value.home is defined
          ansible.builtin.file:
            path: "{{ item.value.home }}"
            state: directory
            recurse: true
            owner: "{{ item.key }}"
            group: "{{ item.key }}"


    - name: Configure mounts
      when: fstab_mounts is defined
      block:
        - name: Create mount points
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: directory
            # This task only cares about the mount point existance and should not override any
            # permissions set by later tasks
          loop: "{{ fstab_mounts }}"

        - name: Configure mounts in /etc/fstab
          ansible.posix.mount:
            backup: "{{ item.backup | default(omit) }}"
            boot: "{{ item.boot | default(omit) }}"
            dump: "{{ item.dump | default(omit) }}"
            fstab: "{{ item.fstab | default(omit) }}"
            fstype: "{{ item.fstype | default(omit) }}"
            opts: "{{ item.opts | default(omit) }}"
            opts_no_log: "{{ item.opts_no_log | default(omit) }}"
            passno: "{{ item.passno | default(omit) }}"
            path: "{{ item.path }}"
            src: "{{ item.src | default(omit) }}"
            state: "{{ item.state }}"
          loop: "{{ fstab_mounts }}"


- name: Configure firewall
  hosts: servers
  tags: firewall
  become: true
  gather_facts: true
  pre_tasks:
    - name: Create firewalld services
      when: firewalld_enabled | default(false)
      loop: "{{ firewalld_local_services | default([]) }}"
      vars:
        service_description: "{{ item.service_description }}"
        service_port: "{{ item.service_port }}"
        service_protocol: "{{ item.service_protocol }}"
      ansible.builtin.template:
        src: "{{ service_template | default('firewalld-service.xml.j2') }}"
        dest: /etc/firewalld/services/{{ item.service_name }}.xml
        owner: root
        group: root
        mode: "0644"
      notify: Reload firewalld

  tasks:
    - name: Configure firewalld zones
      when: firewalld_enabled | default(false)
      loop: "{{ firewalld_config | default({}) | dict2items(key_name='name', value_name='rules') }}"
      loop_control:
        loop_var: zone
      vars:
        local_subnet: "{{ network_local_subnet | default(ansible_facts['default_ipv4']['network'] + '/' + ansible_facts['default_ipv4']['prefix']) }}"
      ansible.builtin.include_tasks:
        file: tasks/firewalld_configure_zone_rules.yaml
        apply:
          tags: firewall

  handlers:
    - name: Reload firewalld
      ansible.builtin.command: firewall-cmd --reload

...
