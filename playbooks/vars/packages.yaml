---

# The following packages are expected to be present on the host system before running anything:
#   - Base distribution files, comes with installation.
#   - Systemd, comes with the installation
#   - Python interpreter, required to run Ansible itself.

base_packages_default:
  - cockpit
  - cockpit-networkmanager
  - cockpit-packagekit
  - cockpit-packages
  - cockpit-podman
  - cockpit-storaged
  - fd
  - htop
  - intel-gpu-tools
  - intel-ucode
  - iproute2
  - less
  - linux-firmware-intel
  - man-db
  - openssh
  - parted
  - pipewire
  - pipewire-jack
  - podman
  - ripgrep
  - rsync
  - sudo
  - tar
  - tmux
  - unzip
  - vim
  - which
  - wireplumber
  - zip

base_packages_before_mapping: "{{ base_packages_host | default(base_packages_default)
                                    | reject('in', base_packages_exclude | default([])) }}"

base_packages_distro: {} # To be overwritten by distro specific var files

base_packages_distro_to_map: "{{ base_packages_distro | dict2items
                                  | selectattr('key', 'in', base_packages_before_mapping) }}"
base_packages_distro_to_map_keys: "{{ base_packages_distro_to_map | map(attribute='key') }}"
base_packages_distro_to_map_values: "{{ base_packages_distro_to_map | map(attribute='value') }}"

base_packages: "{{ (base_packages_before_mapping
                      | reject('in', base_packages_distro_to_map_keys))
                    + base_packages_distro_to_map_values }}"

...
