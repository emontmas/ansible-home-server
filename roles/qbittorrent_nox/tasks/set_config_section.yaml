---

- name: Setting configuration section option
  become: true
  community.general.ini_file:
    path: "{{ qbittorrent_nox_user_home }}/.config/qBittorrent/qBittorrent.conf"
    owner: "{{ qbittorrent_nox_user }}"
    group: "{{ qbittorrent_nox_user }}"
    mode: "0644"
    no_extra_spaces: true
    section: "{{ section.key }}"
    option: "{{ option.key }}"
    value: "{{ option.value }}"
  loop: "{{ section.value | dict2items }}"
  loop_control:
    loop_var: option
  notify:
    - Apply modified configuration

...
