---

argument_specs:
  main:
    short_description: Install and configure qbittorrent-nox client
    description: Install and configure qbittorrent-nox client
    version_added: "0.1"
    author: Elinor Montmasson
    options:
      qbittorrent_nox_packages:
        description: Packages to be installed when qbittorrent-nox is present.
        type: list
        elements: str
        default:
          - qbittorrent-nox

      qbittorrent_nox_user:
        description: |-
          User owning qbittorrent and running its system service.
          If the qbittorrent-nox pacakge already creates a user for qbittorrent, this variable
          must be set accordingly.
        type: str
        default: qbt

      qbittorrent_nox_user_home:
        description: |-
          Home directory for O(qbittorrent_nox_user).
          If the qbittorrent-nox pacakge already creates a user for qbittorrent, this variable
          must be set accordingly.
        type: str
        default: /var/lib/qbittorrent

      qbittorrent_nox_template_service:
        description: |-
          If V(true), the role will consider that the qbittorrent-nox service takes the user to be run
          under as template variable. The system service is then qbittorrent-nox@O(qbittorrent_nox_user).
          This is the most common service packaging done in most distributions.

          If false, the system service is then qbittorrent-nox, and it is considered that the unit file
          already run the service under O(qbittorrent_nox_user).
        type: bool
        default: true

      qbittorrent_nox_webui_port:
        description: WebUI port
        type: int
        default: 8080

      qbittorrent_nox_webui_user:
        description: WebUI username
        type: str
        default: admin

      qbittorrent_nox_webui_password:
        description: WebUI hashed password
        type: str
        # Default password: adminadmin
        default: pFbvL3T4gSD0sDOcuNmraA==:/fOLFcjAY0nl9acL7kbIJfKB6vRq79dW/icPhDrx28U7THCEiugBG1iKhXTqwOCJptexujFcO+8NDnpaFan3oA==

      qbittorrent_nox_locale:
        description: WebUI locale
        type: str
        default: en

      qbittorrent_nox_hook_post_download:
        description: |-
          Script or program to install and run after downloading a torrent.
          The given script can be a jinja template, which will then be templatised.

          The script is called with the following parametes:
            * $1: Torrent name
            * $2: Category
            * $3: Tags (separated by comma)
            * $4: Content path (same as root path for multifile torrent)
            * $5: Root path (first torrent subdirectory path)
            * $6: Save path
            * $7: Number of files
            * $8: Torrent size (bytes)
            * $9: Current tracker
            * $10: Info hash v1
            * $11: Info hash v2
            * $12: Torrent ID
        type: str

      qbittorrent_nox_user_config:
        description: |-
          Additional custom qBittorrent configuration.
          This parameter is a dictionnary of sections from the qBittorrent configuration file with values to modify.
          Each element is also a sub-dictionnary were every field is a configuration option in the section with the value to set.

          This parameter can override any configuration set by other role parameters.
          Example: setting "Preferences - WebUI\Port" will override value set by O(qbittorrent_nox_webui_port).
        type: dict

...
