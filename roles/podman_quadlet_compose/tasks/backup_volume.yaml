---

- name: Backup podman volume as user owner
  become: true
  become_user: "{{ podman_quadlet_compose_user }}"
  block:
    - name: Create temporary backup dir
      ansible.builtin.tempfile:
        state: directory
      register: backup_tmp_dir

    - name: Export volume backup
      containers.podman.podman_export:
        volume: "{{ volume }}"
        dest: "{{ backup_tmp_dir.path }}/{{ volume }}.tar"

    - name: Fetch backup archive
      ansible.posix.synchronize:
        mode: pull
        src: "{{ backup_tmp_dir.path }}/{{ volume }}.tar"
        dest: "{{ backup_path }}/"

    - name: Delete backup on host
      ansible.builtin.file:
        path: "{{ backup_tmp_dir.path }}/{{ volume }}.tar"
        state: absent

- name: Display backup file path
  ansible.builtin.debug:
    msg: "Backup file for {{ volume }} saved at {{ backup_path }}/{{ volume }}.tar"

...
