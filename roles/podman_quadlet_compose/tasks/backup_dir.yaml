---

- name: Archive directory
  community.general.archive:
    path: "{{ path }}/*"  # Archive content not directory itself
    dest: "{{ backup_tmp_dir.path }}/{{ archive_name }}{{ podman_quadlet_compose_backup_archive_extension }}"
    force_archive: true
    format: "{{ podman_quadlet_compose_backup_archive_format }}"

- name: Fetch backup archive
  ansible.posix.synchronize:
    mode: pull
    src: "{{ backup_tmp_dir.path }}/{{ archive_name }}{{ podman_quadlet_compose_backup_archive_extension }}"
    dest: "{{ backup_path }}/"

- name: Delete backup on host
  ansible.builtin.file:
    path: "{{ backup_tmp_dir.path }}/{{ archive_name }}{{ podman_quadlet_compose_backup_archive_extension }}"
    state: absent

- name: Display backup file path
  ansible.builtin.debug:
    msg: "Backup file for {{ path }} saved at {{ backup_path }}/{{ archive_name }}{{ podman_quadlet_compose_backup_archive_extension }}"

...
