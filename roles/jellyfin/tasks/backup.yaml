---

- name: Create backup
  ansible.builtin.uri:
    headers:
      Authorization: >-
        MediaBrowser
        Token="{{ jellyfin_api_token }}"
    url: http://localhost:{{ jellyfin_port | default(8096) }}/Backup/Create
    method: POST
    body_format: json
    body:
      Metadata: true
      Trickplay: true
      Subtitles: true
      Database: true
  register: jellyfin_api_res
  changed_when: true

- name: Create destination directory
  become: false
  delegate_to: localhost
  run_once: true
  ansible.builtin.file:
    path: "{{ jellyfin_backup_dir }}/{{ inventory_hostname }}/"
    state: directory

- name: Fetch backup archive
  ansible.posix.synchronize:
    mode: pull
    src: "{{ jellyfin_api_res.json.Path }}"
    dest: "{{ jellyfin_backup_dir }}/{{ inventory_hostname }}/"

- name: Display backup file path
  ansible.builtin.debug:
    msg: "Backup file saved at {{ jellyfin_backup_dir }}/{{ inventory_hostname }}/{{ jellyfin_api_res.json.Path | basename }}"

...
